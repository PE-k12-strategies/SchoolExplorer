<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Reset password</h1>
      <p class="subtitle" id="intro">
        Choose a new password for your dashboard account.
      </p>

      <div id="waiting-section">
        <p class="subtitle">Verifying your reset link…</p>
      </div>

      <form id="reset-form" class="hidden">
        <label>
          New password
          <input type="password" name="password" required minlength="8" autocomplete="new-password">
        </label>
        <label>
          Confirm password
          <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
        </label>
        <button type="submit">Update password</button>
      </form>

      <p id="back-links" style="margin-top: 16px;">
        <a href="admin.html">← Back to admin sign in</a>
      </p>

      <div id="message" class="message" role="alert"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
  <script>
    const { createClient } = supabase;
    const client = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const waitingSection = document.getElementById('waiting-section');
    const resetForm = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    let ready = false;

    function showMessage(text, type = 'info') {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
    }

    function showResetForm() {
      waitingSection.classList.add('hidden');
      resetForm.classList.remove('hidden');
      ready = true;
    }

    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        showResetForm();
      }
    });

    client.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        showResetForm();
        return;
      }

      const hash = window.location.hash || '';
      if (hash.includes('type=recovery') || hash.includes('access_token')) {
        setTimeout(() => {
          if (!ready) {
            waitingSection.classList.add('hidden');
            showMessage(
              'This reset link could not be opened. Reset the password in Supabase Dashboard → Authentication → Users, or request a new link from admin.html.',
              'error'
            );
          }
        }, 3000);
        return;
      }

      waitingSection.classList.add('hidden');
      showMessage(
        'No valid reset link. Use "Forgot password?" on admin.html, or reset in Supabase Dashboard → Authentication → Users.',
        'warning'
      );
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(resetForm);
      const password = form.get('password');
      const confirm = form.get('confirm');

      if (password !== confirm) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        showMessage(error.message, 'error');
        return;
      }

      showMessage('Password updated. Redirecting to admin sign in…', 'success');
      setTimeout(() => {
        window.location.href = 'admin.html';
      }, 1500);
    });
  </script>
</body>
</html>
